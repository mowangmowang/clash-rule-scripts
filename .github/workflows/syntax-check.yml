name: Configuration CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  required-ci:
    name: required-ci
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          test "$RESULT" = success
