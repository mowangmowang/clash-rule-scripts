name: Manual desktop and mobile release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Full stable version (1.6.1)
        required: true
        type: string
      target_sha:
        description: Full current main SHA (or existing immutable tag SHA when resuming)
        required: true
        type: string
      clients_verified:
        description: Real desktop, Bettbox and mobile client checks completed
        type: boolean
        default: false
      evidence_url:
        description: PR issue-comment URL containing client acceptance JSON
        required: true
        type: string
      resume:
        description: Resume the same version and SHA without overwriting assets
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: desktop-mobile-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  TARGET_SHA: ${{ inputs.target_sha }}
  CLIENTS_VERIFIED: ${{ inputs.clients_verified }}
  EVIDENCE_URL: ${{ inputs.evidence_url }}
  RELEASE_RESUME: ${{ inputs.resume }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: node tools/release.cjs validate
        env:
          GH_TOKEN: ${{ github.token }}
  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      target_sha: ${{ inputs.target_sha }}
  preflight:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: node tools/release.cjs package
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node tools/provider-check.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-provider-report
          path: reports/
          retention-days: 14
  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: release-artifacts/
      - run: node tools/release.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
